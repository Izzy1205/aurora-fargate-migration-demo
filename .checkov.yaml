# Demo trade-offs. Stack lives a few hours with fake data.
directory:
  - terraform
framework:
  - terraform
compact: true
quiet: true
skip-check:
  # No domain or cert for a throwaway demo. ALB is locked to one /32.
  - CKV_AWS_2      # ALB listener HTTPS
  - CKV_AWS_103    # TLS 1.2 on listener
  - CKV2_AWS_20    # HTTP to HTTPS redirect
  - CKV_AWS_378    # target group HTTP
  - CKV_AWS_91     # ALB access logs
  # Torn down same day, protection would only block teardown.
  - CKV_AWS_139    # RDS deletion protection
  - CKV_AWS_150    # ALB deletion protection
  # CMKs have a 7 day deletion wait, which fights build/demo/destroy.
  - CKV_AWS_327    # RDS with KMS CMK
  - CKV_AWS_136    # ECR with KMS CMK
  - CKV_AWS_158    # CloudWatch log groups with KMS CMK
  - CKV_AWS_338    # log retention of 1 year
  # Paid monitoring, not needed for a demo.
  - CKV_AWS_353    # RDS Performance Insights
  - CKV_AWS_118    # RDS enhanced monitoring
  - CKV_AWS_65     # ECS Container Insights
  - CKV2_AWS_27    # Postgres statement logging
  # Flyway (JVM) needs a writable filesystem.
  - CKV_AWS_336
  # False positive: these SGs are attached in other modules.
  - CKV2_AWS_5
  - CKV_AWS_394
