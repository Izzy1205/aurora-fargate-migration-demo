# Weekly version bumps. CVE fixes don't wait for this, they come from
# Dependabot security updates in the repo settings.
# Minor and patch bumps are grouped per ecosystem to cut noise. Majors come one
# per PR so I actually look at them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /app
      - /db
    schedule:
      interval: weekly
    groups:
      docker-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  # The committed lock files live in each Terragrunt unit folder under
  # terraform/environments, which Dependabot can't update. After a provider
  # bump here, refresh them with `terraform providers lock` (see README).
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/layers/*
      - /terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform-minor:
        update-types: [minor, patch]
