# Weekly bumps. Security fixes come from Dependabot security updates instead.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /app
      - /db
    schedule:
      interval: weekly
    groups:
      docker-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  # Lock files under environments/ aren't updated by Dependabot. Run `terraform providers lock`.
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/layers/*
      - /terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform-minor:
        update-types: [minor, patch]
