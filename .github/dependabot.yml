# Dependabot opens PRs for new versions once a week. Security fixes for known
# CVEs come as soon as they are published (Settings > Advanced Security >
# Dependabot security updates), not on this schedule.
#
# Minor and patch bumps are grouped into one PR per ecosystem to keep the
# noise down. Major bumps come one per PR so they get a proper look.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /app
      - /db
    schedule:
      interval: weekly
    groups:
      docker-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  # Provider constraints and lock files for both roots and every module.
  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/bootstrap
      - /terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform-minor:
        update-types: [minor, patch]
