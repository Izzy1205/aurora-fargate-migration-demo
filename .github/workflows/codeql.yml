name: codeql

# GitHub's code scanner. Looks for security bugs in the Python app and in
# these workflow files (for example, untrusted input reaching a shell). Results
# show up under Security > Code scanning. Runs on PRs, on main, and once a week
# so new queries get a chance to find old bugs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"  # Mondays 06:23 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # read workflow run details for the upload
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      # Python and workflow files are scanned from source, no build step needed.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
