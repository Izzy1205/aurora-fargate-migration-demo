name: deploy

# plan: terraform plan with the read-only plan role (production-infra-plan env,
#   no reviewer). Uploads the readable plan for review and keeps the binary
#   plan in the state bucket.
# scan: builds both images and runs Trivy, no AWS access. Runs alongside plan.
# infra: waits for review in production-infra, then applies the exact plan
#   from the plan job with the terraform role. Waits for scan too, so a bad
#   image stops the run before anything changes.
# release: pushes the scanned images, runs Flyway, rolls the service with the
#   deploy role (production-app env).
#
# Manual for now. For deploys on every merge add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false  # never cancel a half-finished apply or migration

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: aurora-fargate-migration-demo/terraform.tfstate
  APP_DESIRED_COUNT: "2"  # one task per AZ

jobs:
  # The repo is public, and so are its Actions artifacts to anyone signed in to
  # GitHub. So the artifact only holds the readable plan (sensitive values are
  # redacted by terraform show) and the binary plan's sha256. The binary plan
  # can hold real values, so it goes to the private state bucket instead.
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    environment: production-infra-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
      TF_VAR_alb_ingress_cidrs: ${{ vars.ALB_INGRESS_CIDRS }}
      PLAN_KEY: plans/${{ github.run_id }}-${{ github.run_attempt }}/tfplan
    outputs:
      plan_key: ${{ steps.save.outputs.plan_key }}
      plan_sha256: ${{ steps.save.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo '### terraform plan'
            echo 'Review this (or the terraform-plan artifact) before approving production-infra.'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: save plan
        id: save
        run: |
          sha=$(sha256sum tfplan | cut -d' ' -f1)
          echo "$sha  tfplan" > tfplan.sha256
          aws s3 cp tfplan "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" --only-show-errors
          {
            echo "plan_key=${PLAN_KEY}"
            echo "plan_sha256=${sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Binary plan sha256: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            terraform/plan.txt
            terraform/tfplan.sha256
          retention-days: 5

  # No credentials or OIDC token here, so a compromised scanner can't reach
  # AWS. A fixable CRITICAL fails the job and release never runs.
  scan:
    name: build and scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: build images
        run: |
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-app:$TAG" app
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-migrate:$TAG" db

      # SHA pin, see pr.yml for why.
      - name: scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:${{ env.TAG }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: scan migration image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:${{ env.TAG }}
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: save scanned images
        run: docker save -o images.tar "demo-app:$TAG" "demo-migrate:$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar
          retention-days: 1

  infra:
    name: terraform apply
    needs: [plan, scan]
    runs-on: ubuntu-latest
    environment: production-infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    outputs:
      cluster: ${{ steps.out.outputs.cluster }}
      service: ${{ steps.out.outputs.service }}
      app_family: ${{ steps.out.outputs.app_family }}
      migration_family: ${{ steps.out.outputs.migration_family }}
      subnets: ${{ steps.out.outputs.subnets }}
      migration_sg: ${{ steps.out.outputs.migration_sg }}
      app_repo: ${{ steps.out.outputs.app_repo }}
      migration_repo: ${{ steps.out.outputs.migration_repo }}
      migration_log_group: ${{ steps.out.outputs.migration_log_group }}
      app_url: ${{ steps.out.outputs.app_url }}
    steps:
      - uses: actions/checkout@v7

      # Same Terraform version, backend and lock file as the plan job. A saved
      # plan refuses to apply if any of those differ or if the state changed
      # since the plan was made.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
          mask-aws-account-id: false  # outputs below are passed between jobs

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: fetch and check the reviewed plan
        run: |
          aws s3 cp "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" tfplan --only-show-errors
          echo "${PLAN_SHA256}  tfplan" | sha256sum --check --strict

      - name: apply the reviewed plan
        run: terraform apply -no-color tfplan

      - name: remove the saved plan
        if: ${{ always() }}
        run: aws s3 rm "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" --only-show-errors || true

      - name: export outputs
        id: out
        run: |
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw app_service_name)"
            echo "app_family=$(terraform output -raw app_task_family)"
            echo "migration_family=$(terraform output -raw migration_task_family)"
            echo "subnets=$(terraform output -raw private_subnet_ids_csv)"
            echo "migration_sg=$(terraform output -raw migration_security_group_id)"
            echo "app_repo=$(terraform output -raw app_ecr_repository)"
            echo "migration_repo=$(terraform output -raw migration_ecr_repository)"
            echo "migration_log_group=$(terraform output -raw migration_log_group)"
            echo "app_url=$(terraform output -raw app_url)"
          } >> "$GITHUB_OUTPUT"

  release:
    name: build, migrate, deploy
    needs: [infra, scan]
    runs-on: ubuntu-latest
    environment: production-app
    permissions:
      contents: read
      id-token: write
    env:
      CLUSTER: ${{ needs.infra.outputs.cluster }}
      SERVICE: ${{ needs.infra.outputs.service }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Not rebuilt, so what ships is exactly what was scanned.
      - uses: actions/download-artifact@v8
        with:
          name: images

      - name: push scanned images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_REPO: ${{ needs.infra.outputs.app_repo }}
          MIGRATION_REPO: ${{ needs.infra.outputs.migration_repo }}
        run: |
          docker load -i images.tar
          push_once() {
            local repo=$1 local_image=$2
            # Tags are immutable, so a re-run of the same commit reuses the image.
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already exists, skipping push"
              return
            fi
            docker tag "$local_image:$TAG" "$REGISTRY/$repo:$TAG"
            docker push "$REGISTRY/$repo:$TAG"
          }
          push_once "$APP_REPO" demo-app
          push_once "$MIGRATION_REPO" demo-migrate

      # Schema first. Expand-only, so the old code is fine with it.
      - name: run Flyway migration task in the private subnets
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          MIGRATION_REPO: ${{ needs.infra.outputs.migration_repo }}
          MIGRATION_FAMILY: ${{ needs.infra.outputs.migration_family }}
          SUBNETS: ${{ needs.infra.outputs.subnets }}
          SECURITY_GROUP: ${{ needs.infra.outputs.migration_sg }}
          LOG_GROUP: ${{ needs.infra.outputs.migration_log_group }}
        run: |
          TASK_DEFINITION=$(bash scripts/register-task-def.sh "$MIGRATION_FAMILY" migrate "$REGISTRY/$MIGRATION_REPO:$TAG")
          export TASK_DEFINITION
          bash scripts/run-migration.sh

      # Only reached if the migration exited 0.
      - name: deploy app
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_REPO: ${{ needs.infra.outputs.app_repo }}
          APP_FAMILY: ${{ needs.infra.outputs.app_family }}
          APP_URL: ${{ needs.infra.outputs.app_url }}
        run: |
          task_def=$(bash scripts/register-task-def.sh "$APP_FAMILY" app "$REGISTRY/$APP_REPO:$TAG")
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$task_def" --desired-count "$APP_DESIRED_COUNT" >/dev/null
          echo "Waiting for $SERVICE to be stable on $task_def with $APP_DESIRED_COUNT tasks"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Deployed. Open ${APP_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
