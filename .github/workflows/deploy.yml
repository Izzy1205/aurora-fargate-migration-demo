name: deploy


# Deploys testing, the only environment that builds images. infra.yml plans
# and applies network, data, app, then observability, one unit at a time,
# each from its exact saved plan.
# A merge to main deploys testing on its own. The testing-infra and
# testing-app environments have no required reviewers, so testing applies
# run without waiting; they only allow the main branch. Reviewer rules live
# in the GitHub environment settings, not in this file. Stage and production
# never build: promote.yml copies an image already running in testing (or
# stage) by digest, and production only runs by hand or from a v* tag.
# Any plan that deletes or replaces a resource fails (see tg-plan.yml).
# Teardowns are done by hand with scripts/teardown.sh.
# The release job pushes the scanned images, sets up the DB logins, runs
# Flyway as its own login, and rolls the service.
# Images are pushed with the commit SHA tag (for humans) and every task
# definition points at the image digest, repo@sha256:... (for deployment).
# The digest is content-addressed, so a task can only ever run the exact
# bytes Trivy scanned. Rollback: point the service at an earlier task
# definition revision, which still holds its own digest.
on:
  push:
    branches: [main]
    # Docs and the local teardown script don't change what's deployed.
    paths-ignore:
      - README.md
      - docs/**
      - scripts/teardown.sh
  workflow_dispatch:
    inputs:
      env:
        description: Only testing builds and deploys here. Stage and production use promote.yml.
        type: choice
        options: [testing]
        default: testing

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.env || 'testing' }}
  cancel-in-progress: false  # never cancel a half-finished apply or migration

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # No credentials or OIDC token here, so a compromised scanner can't reach
  # AWS. A fixable CRITICAL fails the job and release never runs.
  # The registry digest only exists after the push, which needs credentials,
  # so this job records each scanned image's content ID and release checks
  # the images it pushes still match before resolving their digests.
  scan:
    name: build and scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.sha }}
    outputs:
      app_image_id: ${{ steps.ids.outputs.app_image_id }}
      migrate_image_id: ${{ steps.ids.outputs.migrate_image_id }}
    steps:
      - uses: actions/checkout@v7

      - name: build images
        run: |
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-app:$TAG" app
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-migrate:$TAG" db

      # SHA pin, see pr.yml for why.
      - name: scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:${{ env.TAG }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: scan migration image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:${{ env.TAG }}
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: record scanned image IDs
        id: ids
        run: |
          image_id() {
            local id
            id=$(docker image inspect --format '{{.Id}}' "$1")
            if [[ ! "$id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::unexpected image ID for $1: $id" >&2
              return 1
            fi
            echo "$id"
          }
          app_id=$(image_id "demo-app:$TAG")
          migrate_id=$(image_id "demo-migrate:$TAG")
          {
            echo "app_image_id=$app_id"
            echo "migrate_image_id=$migrate_id"
          } >> "$GITHUB_OUTPUT"

      - name: save scanned images
        run: docker save -o images.tar "demo-app:$TAG" "demo-migrate:$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar
          retention-days: 1

  # Waits for the scan, so a failed scan never reaches AWS. That means the
  # network plan starts after the scan finishes, not alongside it.
  infra:
    needs: [scan]
    uses: ./.github/workflows/infra.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}

  release:
    name: build, migrate, deploy
    needs: [infra, scan]
    if: >-
      !cancelled() &&
      needs.infra.result == 'success' &&
      needs.scan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'testing' }}-app
    permissions:
      contents: read
      id-token: write
    env:
      CLUSTER: ${{ needs.infra.outputs.cluster }}
      SERVICE: ${{ needs.infra.outputs.service }}
      TAG: ${{ github.sha }}
      APP_DESIRED_COUNT: ${{ needs.infra.outputs.desired_count }}  # app_desired_count in env.hcl
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/check-role
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          env: ${{ inputs.env || 'testing' }}
          kind: deploy

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Not rebuilt, so what ships is exactly what was scanned.
      - uses: actions/download-artifact@v8
        with:
          name: images

      # Pushes the SHA tag, then reads back the digest ECR stored for it.
      # Everything after this step deploys by that digest.
      - name: push scanned images
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_REPO: ${{ needs.infra.outputs.app_repo }}
          MIGRATION_REPO: ${{ needs.infra.outputs.migration_repo }}
          APP_IMAGE_ID: ${{ needs.scan.outputs.app_image_id }}
          MIGRATE_IMAGE_ID: ${{ needs.scan.outputs.migrate_image_id }}
        run: |
          docker load -i images.tar
          # The artifact must hold exactly the images the scan job scanned.
          check_id() {
            local local_image=$1 want=$2 got
            got=$(docker image inspect --format '{{.Id}}' "$local_image:$TAG")
            if [[ "$got" != "$want" ]]; then
              echo "::error::$local_image:$TAG is $got but the scan job scanned $want" >&2
              return 1
            fi
          }
          check_id demo-app "$APP_IMAGE_ID"
          check_id demo-migrate "$MIGRATE_IMAGE_ID"

          push_once() {
            local repo=$1 local_image=$2
            # Tags are immutable, so a re-run of the same commit reuses the
            # image that was scanned and pushed the first time.
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "::notice::$repo:$TAG already exists, skipping push and deploying its existing digest"
              return
            fi
            docker tag "$local_image:$TAG" "$REGISTRY/$repo:$TAG"
            docker push "$REGISTRY/$repo:$TAG"
          }
          digest_of() {
            local repo=$1 digest
            digest=$(aws ecr describe-images --repository-name "$repo" \
              --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::bad digest for $repo:$TAG: $digest" >&2
              return 1
            fi
            echo "$digest"
          }
          push_once "$APP_REPO" demo-app
          push_once "$MIGRATION_REPO" demo-migrate
          app_digest=$(digest_of "$APP_REPO")
          migrate_digest=$(digest_of "$MIGRATION_REPO")
          {
            echo "app_digest=$app_digest"
            echo "migrate_digest=$migrate_digest"
            echo "app_image=$REGISTRY/$APP_REPO@$app_digest"
            echo "migrate_image=$REGISTRY/$MIGRATION_REPO@$migrate_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Images for ${TAG::7}"
            echo "- app: \`$APP_REPO:$TAG\` = \`$app_digest\`"
            echo "- migrate: \`$MIGRATION_REPO:$TAG\` = \`$migrate_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # DB logins, Flyway, app, then the SSN vault. Same steps promote.yml
      # runs for stage and production.
      - uses: ./.github/actions/roll-out
        with:
          tag: ${{ env.TAG }}
          app-image: ${{ steps.push.outputs.app_image }}
          migrate-image: ${{ steps.push.outputs.migrate_image }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.SERVICE }}
          app-family: ${{ needs.infra.outputs.app_family }}
          app-desired-count: ${{ env.APP_DESIRED_COUNT }}
          app-url: ${{ needs.infra.outputs.app_url }}
          migration-family: ${{ needs.infra.outputs.migration_family }}
          db-logins-family: ${{ needs.infra.outputs.db_logins_family }}
          subnets: ${{ needs.infra.outputs.subnets }}
          migration-sg: ${{ needs.infra.outputs.migration_sg }}
          migration-log-group: ${{ needs.infra.outputs.migration_log_group }}
          vault-service: ${{ needs.infra.outputs.vault_service }}
          vault-family: ${{ needs.infra.outputs.vault_family }}
          vault-container: ${{ needs.infra.outputs.vault_container }}
          vault-desired-count: ${{ needs.infra.outputs.vault_desired_count }}
