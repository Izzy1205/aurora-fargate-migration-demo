name: deploy

# Plans and applies one unit at a time: network, data, app, observability.
# Every apply waits for a reviewer. Plans that delete or replace fail.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - scripts/teardown.sh
  workflow_dispatch:
    inputs:
      env:
        description: Environment under terraform/environments. stage and production are not deployed yet.
        type: choice
        options: [testing]
        default: testing

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.env || 'testing' }}
  cancel-in-progress: false  # never cancel a half-finished apply or migration

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # No AWS creds here, so a compromised scanner can't reach AWS.
  scan:
    name: build and scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: build images
        run: |
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-app:$TAG" app
          docker build --build-arg APP_VERSION="${TAG::7}" -t "demo-migrate:$TAG" db

      - name: scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:${{ env.TAG }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: scan migration image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:${{ env.TAG }}
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: save scanned images
        run: docker save -o images.tar "demo-app:$TAG" "demo-migrate:$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar
          retention-days: 1

  network-plan:
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: network

  network-apply:
    needs: [network-plan, scan]
    if: needs.network-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: network
      plan_key: ${{ needs.network-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.network-plan.outputs.plan_sha256 }}

  data-plan:
    needs: [network-plan, network-apply, scan]
    if: >-
      !cancelled() &&
      needs.network-plan.result == 'success' &&
      needs.scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.network-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: data

  data-apply:
    needs: [data-plan, scan]
    if: >-
      !cancelled() &&
      needs.scan.result == 'success' &&
      needs.data-plan.result == 'success' &&
      needs.data-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: data
      plan_key: ${{ needs.data-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.data-plan.outputs.plan_sha256 }}

  app-plan:
    needs: [data-plan, data-apply, scan]
    if: >-
      !cancelled() &&
      needs.data-plan.result == 'success' &&
      needs.scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.data-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: app

  app-apply:
    needs: [app-plan, scan]
    if: >-
      !cancelled() &&
      needs.scan.result == 'success' &&
      needs.app-plan.result == 'success' &&
      needs.app-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: app
      plan_key: ${{ needs.app-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.app-plan.outputs.plan_sha256 }}

  observability-plan:
    needs: [app-plan, app-apply, scan]
    if: >-
      !cancelled() &&
      needs.app-plan.result == 'success' &&
      needs.scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.app-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: observability

  observability-apply:
    needs: [observability-plan, scan]
    if: >-
      !cancelled() &&
      needs.scan.result == 'success' &&
      needs.observability-plan.result == 'success' &&
      needs.observability-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env || 'testing' }}
      unit: observability
      plan_key: ${{ needs.observability-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.observability-plan.outputs.plan_sha256 }}

  # Read with the plan role after the last apply.
  outputs:
    name: read app outputs
    needs: [app-plan, app-apply, scan]
    if: >-
      !cancelled() &&
      needs.app-plan.result == 'success' &&
      needs.scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.app-apply.result)
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'testing' }}-infra-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
        shell: bash
    env:
      MIGDEMO_OWNER: ${{ vars.OWNER }}
      MIGDEMO_BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      MIGDEMO_ALB_INGRESS_CIDRS: ${{ vars.ALB_INGRESS_CIDRS }}
      MIGDEMO_MOCKS_ON_PLAN: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
      UNIT_DIR: environments/${{ inputs.env || 'testing' }}/app
    outputs:
      cluster: ${{ steps.out.outputs.cluster }}
      service: ${{ steps.out.outputs.service }}
      app_family: ${{ steps.out.outputs.app_family }}
      migration_family: ${{ steps.out.outputs.migration_family }}
      db_logins_family: ${{ steps.out.outputs.db_logins_family }}
      subnets: ${{ steps.out.outputs.subnets }}
      migration_sg: ${{ steps.out.outputs.migration_sg }}
      app_repo: ${{ steps.out.outputs.app_repo }}
      migration_repo: ${{ steps.out.outputs.migration_repo }}
      migration_log_group: ${{ steps.out.outputs.migration_log_group }}
      app_url: ${{ steps.out.outputs.app_url }}
      desired_count: ${{ steps.out.outputs.desired_count }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: ./.github/actions/setup-terragrunt

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-outputs-${{ github.run_id }}
          mask-aws-account-id: false

      - name: export outputs
        id: out
        run: |
          terragrunt run --working-dir "$UNIT_DIR" --non-interactive --tf-forward-stdout \
            -- output -json > "$RUNNER_TEMP/outputs.json"
          o() { jq -er --arg k "$1" '.[$k].value' "$RUNNER_TEMP/outputs.json"; }
          {
            echo "cluster=$(o ecs_cluster_name)"
            echo "service=$(o app_service_name)"
            echo "app_family=$(o app_task_family)"
            echo "migration_family=$(o migration_task_family)"
            echo "db_logins_family=$(o db_logins_task_family)"
            echo "subnets=$(o private_subnet_ids_csv)"
            echo "migration_sg=$(o migration_security_group_id)"
            echo "app_repo=$(o app_ecr_repository)"
            echo "migration_repo=$(o migration_ecr_repository)"
            echo "migration_log_group=$(o migration_log_group)"
            echo "app_url=$(o app_url)"
            echo "desired_count=$(o app_desired_count)"
          } >> "$GITHUB_OUTPUT"

  release:
    name: build, migrate, deploy
    needs: [outputs, scan]
    if: >-
      !cancelled() &&
      needs.outputs.result == 'success' &&
      needs.scan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'testing' }}-app
    permissions:
      contents: read
      id-token: write
    env:
      CLUSTER: ${{ needs.outputs.outputs.cluster }}
      SERVICE: ${{ needs.outputs.outputs.service }}
      TAG: ${{ github.sha }}
      APP_DESIRED_COUNT: ${{ needs.outputs.outputs.desired_count }}  # from env.hcl
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Not rebuilt, so we ship exactly what was scanned.
      - uses: actions/download-artifact@v8
        with:
          name: images

      - name: push scanned images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_REPO: ${{ needs.outputs.outputs.app_repo }}
          MIGRATION_REPO: ${{ needs.outputs.outputs.migration_repo }}
        run: |
          docker load -i images.tar
          push_once() {
            local repo=$1 local_image=$2
            # Tags are immutable, so a re-run reuses the image.
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already exists, skipping push"
              return
            fi
            docker tag "$local_image:$TAG" "$REGISTRY/$repo:$TAG"
            docker push "$REGISTRY/$repo:$TAG"
          }
          push_once "$APP_REPO" demo-app
          push_once "$MIGRATION_REPO" demo-migrate

      # Only task that reads the master secret. Safe to re-run.
      - name: set up DB logins in the private subnets
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          MIGRATION_REPO: ${{ needs.outputs.outputs.migration_repo }}
          DB_LOGINS_FAMILY: ${{ needs.outputs.outputs.db_logins_family }}
          SUBNETS: ${{ needs.outputs.outputs.subnets }}
          SECURITY_GROUP: ${{ needs.outputs.outputs.migration_sg }}
          LOG_GROUP: ${{ needs.outputs.outputs.migration_log_group }}
          CONTAINER: db-logins
        run: |
          TASK_DEFINITION=$(bash scripts/register-task-def.sh "$DB_LOGINS_FAMILY" db-logins "$REGISTRY/$MIGRATION_REPO:$TAG")
          export TASK_DEFINITION
          bash scripts/run-migration.sh

      # Expand-only, so old code still works.
      - name: run Flyway migration task in the private subnets
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          MIGRATION_REPO: ${{ needs.outputs.outputs.migration_repo }}
          MIGRATION_FAMILY: ${{ needs.outputs.outputs.migration_family }}
          SUBNETS: ${{ needs.outputs.outputs.subnets }}
          SECURITY_GROUP: ${{ needs.outputs.outputs.migration_sg }}
          LOG_GROUP: ${{ needs.outputs.outputs.migration_log_group }}
        run: |
          TASK_DEFINITION=$(bash scripts/register-task-def.sh "$MIGRATION_FAMILY" migrate "$REGISTRY/$MIGRATION_REPO:$TAG")
          export TASK_DEFINITION
          bash scripts/run-migration.sh

      - name: deploy app
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_REPO: ${{ needs.outputs.outputs.app_repo }}
          APP_FAMILY: ${{ needs.outputs.outputs.app_family }}
          APP_URL: ${{ needs.outputs.outputs.app_url }}
        run: |
          task_def=$(bash scripts/register-task-def.sh "$APP_FAMILY" app "$REGISTRY/$APP_REPO:$TAG")
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$task_def" --desired-count "$APP_DESIRED_COUNT" >/dev/null
          echo "Waiting for $SERVICE to be stable on $task_def with $APP_DESIRED_COUNT tasks"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Deployed. Open ${APP_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
