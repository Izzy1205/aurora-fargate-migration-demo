name: infra

# Plans and applies one environment, one Terragrunt unit at a time:
# network, data, app, then observability. Each unit is planned (tg-plan.yml),
# then the exact saved plan is applied (tg-apply.yml), and only when the plan
# has changes. Then reads the app unit's outputs for the caller's release job.
#
# Called by deploy.yml (testing, after the image scan) and promote.yml (stage
# and production, after the source digest is resolved). Which reviewers each
# job waits for is set on the <env>-infra-plan and <env>-infra GitHub
# environments, not here. Any plan that deletes or replaces a resource fails.
on:
  workflow_call:
    inputs:
      env:
        description: Folder under terraform/environments.
        type: string
        required: true
      ref:
        description: Commit to plan and apply. Empty means the commit that started the run.
        type: string
        default: ""
    outputs:
      cluster:
        value: ${{ jobs.outputs.outputs.cluster }}
      service:
        value: ${{ jobs.outputs.outputs.service }}
      app_family:
        value: ${{ jobs.outputs.outputs.app_family }}
      migration_family:
        value: ${{ jobs.outputs.outputs.migration_family }}
      db_logins_family:
        value: ${{ jobs.outputs.outputs.db_logins_family }}
      subnets:
        value: ${{ jobs.outputs.outputs.subnets }}
      migration_sg:
        value: ${{ jobs.outputs.outputs.migration_sg }}
      app_repo:
        value: ${{ jobs.outputs.outputs.app_repo }}
      migration_repo:
        value: ${{ jobs.outputs.outputs.migration_repo }}
      migration_log_group:
        value: ${{ jobs.outputs.outputs.migration_log_group }}
      app_url:
        value: ${{ jobs.outputs.outputs.app_url }}
      app_cert_self_signed:
        value: ${{ jobs.outputs.outputs.app_cert_self_signed }}
      desired_count:
        value: ${{ jobs.outputs.outputs.desired_count }}
      vault_service:
        value: ${{ jobs.outputs.outputs.vault_service }}
      vault_family:
        value: ${{ jobs.outputs.outputs.vault_family }}
      vault_container:
        value: ${{ jobs.outputs.outputs.vault_container }}
      vault_desired_count:
        value: ${{ jobs.outputs.outputs.vault_desired_count }}

permissions:
  contents: read

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  network-plan:
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: network
      ref: ${{ inputs.ref }}

  network-apply:
    needs: [network-plan]
    if: needs.network-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: network
      ref: ${{ inputs.ref }}
      plan_key: ${{ needs.network-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.network-plan.outputs.plan_sha256 }}

  # Runs after network is applied, or when network had nothing to apply.
  data-plan:
    needs: [network-plan, network-apply]
    if: >-
      !cancelled() &&
      needs.network-plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.network-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: data
      ref: ${{ inputs.ref }}

  data-apply:
    needs: [data-plan]
    if: >-
      !cancelled() &&
      needs.data-plan.result == 'success' &&
      needs.data-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: data
      ref: ${{ inputs.ref }}
      plan_key: ${{ needs.data-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.data-plan.outputs.plan_sha256 }}

  app-plan:
    needs: [data-plan, data-apply]
    if: >-
      !cancelled() &&
      needs.data-plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.data-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: app
      ref: ${{ inputs.ref }}

  app-apply:
    needs: [app-plan]
    if: >-
      !cancelled() &&
      needs.app-plan.result == 'success' &&
      needs.app-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: app
      ref: ${{ inputs.ref }}
      plan_key: ${{ needs.app-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.app-plan.outputs.plan_sha256 }}

  observability-plan:
    needs: [app-plan, app-apply]
    if: >-
      !cancelled() &&
      needs.app-plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.app-apply.result)
    uses: ./.github/workflows/tg-plan.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: observability
      ref: ${{ inputs.ref }}

  observability-apply:
    needs: [observability-plan]
    if: >-
      !cancelled() &&
      needs.observability-plan.result == 'success' &&
      needs.observability-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/tg-apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: ${{ inputs.env }}
      unit: observability
      ref: ${{ inputs.ref }}
      plan_key: ${{ needs.observability-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.observability-plan.outputs.plan_sha256 }}

  # The caller's release job needs these names and IDs. Read with the
  # read-only plan role after the app apply. The app unit passes through the
  # network values release needs, so this is the only unit read here.
  outputs:
    name: read app outputs
    needs: [app-plan, app-apply]
    if: >-
      !cancelled() &&
      needs.app-plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.app-apply.result)
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}-infra-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
        shell: bash
    env:
      MIGDEMO_OWNER: ${{ vars.OWNER }}
      MIGDEMO_BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      MIGDEMO_ALB_INGRESS_CIDRS: ${{ vars.ALB_INGRESS_CIDRS }}
      MIGDEMO_MOCKS_ON_PLAN: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
      UNIT_DIR: environments/${{ inputs.env }}/app
    outputs:
      cluster: ${{ steps.out.outputs.cluster }}
      service: ${{ steps.out.outputs.service }}
      app_family: ${{ steps.out.outputs.app_family }}
      migration_family: ${{ steps.out.outputs.migration_family }}
      db_logins_family: ${{ steps.out.outputs.db_logins_family }}
      subnets: ${{ steps.out.outputs.subnets }}
      migration_sg: ${{ steps.out.outputs.migration_sg }}
      app_repo: ${{ steps.out.outputs.app_repo }}
      migration_repo: ${{ steps.out.outputs.migration_repo }}
      migration_log_group: ${{ steps.out.outputs.migration_log_group }}
      app_url: ${{ steps.out.outputs.app_url }}
      app_cert_self_signed: ${{ steps.out.outputs.app_cert_self_signed }}
      desired_count: ${{ steps.out.outputs.desired_count }}
      vault_service: ${{ steps.out.outputs.vault_service }}
      vault_family: ${{ steps.out.outputs.vault_family }}
      vault_container: ${{ steps.out.outputs.vault_container }}
      vault_desired_count: ${{ steps.out.outputs.vault_desired_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/check-role
        with:
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          env: ${{ inputs.env }}
          kind: plan

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: ./.github/actions/setup-terragrunt

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-outputs-${{ github.run_id }}
          mask-aws-account-id: false  # outputs below are passed between jobs

      - name: export outputs
        id: out
        run: |
          terragrunt run --working-dir "$UNIT_DIR" --non-interactive --tf-forward-stdout \
            -- output -json > "$RUNNER_TEMP/outputs.json"
          o() { jq -er --arg k "$1" '.[$k].value' "$RUNNER_TEMP/outputs.json"; }
          {
            echo "cluster=$(o ecs_cluster_name)"
            echo "service=$(o app_service_name)"
            echo "app_family=$(o app_task_family)"
            echo "migration_family=$(o migration_task_family)"
            echo "db_logins_family=$(o db_logins_task_family)"
            echo "subnets=$(o private_subnet_ids_csv)"
            echo "migration_sg=$(o migration_security_group_id)"
            echo "app_repo=$(o app_ecr_repository)"
            echo "migration_repo=$(o migration_ecr_repository)"
            echo "migration_log_group=$(o migration_log_group)"
            echo "app_url=$(o app_url)"
            # tostring because jq -e treats a plain false as a failure.
            echo "app_cert_self_signed=$(jq -er '.certificate_self_signed.value | tostring' "$RUNNER_TEMP/outputs.json")"
            echo "desired_count=$(o app_desired_count)"
            echo "vault_service=$(o ssn_vault_service_name)"
            echo "vault_family=$(o ssn_vault_task_family)"
            echo "vault_container=$(o ssn_vault_container_name)"
            echo "vault_desired_count=$(o ssn_vault_desired_count)"
          } >> "$GITHUB_OUTPUT"
