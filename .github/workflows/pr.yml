name: pr

# Checks on every pull request. Nothing here can change AWS: the plan job
# assumes a read-only role, and the other jobs have no AWS access at all.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# Hardening note: actions are pinned to major tags for readability. For a
# real pipeline, pin each one to a full commit SHA and let Dependabot bump it.

jobs:
  terraform:
    name: terraform fmt / validate / lint / plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for the read-only plan role
      pull-requests: write  # post the plan as a PR comment
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
      TF_VAR_alb_ingress_cidrs: ${{ vars.ALB_INGRESS_CIDRS }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: validate (main and bootstrap, no backend)
        run: |
          terraform init -backend=false
          terraform validate
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=bootstrap validate

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids GitHub API rate limits when fetching the AWS ruleset
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      # Fork PRs get no OIDC token, so plan only runs for branches in this repo.
      - name: AWS credentials (read-only plan role)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: plan
        id: plan
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aurora-fargate-migration-demo/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo '### terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: comment plan on PR
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const body = '### terraform plan\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  iac-scan:
    name: checkov (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: checkov
        run: |
          pip install --quiet checkov==3.3.30
          checkov --config-file .checkov.yaml

  secrets-scan:
    name: gitleaks (secret scan of full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  migrations:
    name: flyway against throwaway Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Local, throwaway CI container with no network exposure beyond
          # the runner. Trust auth avoids putting even a fake password here.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: build migration image
        run: docker build -t demo-migrate:ci db

      - name: migrate to V2 (state before this release), then to latest
        run: |
          run_flyway() {
            docker run --rm --network host \
              -e FLYWAY_URL=jdbc:postgresql://localhost:5432/postgres \
              -e FLYWAY_USER=postgres \
              demo-migrate:ci "$@"
          }
          run_flyway migrate -target=2
          run_flyway migrate
          run_flyway validate
          run_flyway info

      - name: check expand-only result
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE total bigint; nulls bigint;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_name = 'orders' AND column_name = 'priority') THEN
              RAISE NOTICE 'orders.priority not present yet, nothing to check';
              RETURN;
            END IF;
            SELECT count(*), count(*) FILTER (WHERE priority IS NULL)
              INTO total, nulls FROM orders;
            IF total = 0 OR nulls <> total THEN
              RAISE EXCEPTION 'expected every seeded row to keep priority NULL, got % of %', nulls, total;
            END IF;
            RAISE NOTICE 'ok: % existing rows untouched by the expand step', total;
          END $$;
          SQL

  app:
    name: app tests and image build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: docker build
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t demo-app:ci .

  sast:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Fails on any finding of medium or higher severity that bandit is at
      # least medium sure about. Tests are skipped: asserts and fake values
      # there are expected.
      - name: bandit
        run: |
          pip install --quiet bandit==1.9.4
          bandit -r app --exclude app/tests,app/.venv \
            --severity-level medium --confidence-level medium

  deps-scan:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Checks every pinned package (and what it pulls in) against the PyPA
      # and OSV advisory databases. Any known CVE fails the job.
      - name: pip-audit
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit --progress-spinner off \
            -r app/requirements.txt -r app/requirements-dev.txt

  image-scan:
    name: trivy (container image scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
    steps:
      - uses: actions/checkout@v7

      # Built locally on the runner and never pushed anywhere.
      - name: build images
        run: |
          docker build -t demo-app:ci app
          docker build -t demo-migrate:ci db

      # Trivy is pinned to a full commit SHA, not a tag. Its tags were hijacked
      # in March 2026 (GHSA-69fq-xp46-6x23), and a SHA can't be moved.
      # ignore-unfixed skips CVEs that have no fixed package yet, since there
      # is nothing to upgrade to. Those still show in the full report.
      - name: scan app image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-app.sarif

      - name: scan migration image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-migrate.sarif

      # Fork PRs get a read-only token, so only same-repo PRs upload.
      - name: upload app results to Security tab
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app-image

      - name: upload migration results to Security tab
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-migrate.sarif
          category: trivy-migrate-image

      # The gate. A fixable HIGH or CRITICAL in either image fails the PR.
      - name: gate on app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: gate on migration image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
