name: pr

# Nothing here can change AWS. The plan job uses the read-only role and the
# rest have no AWS access.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# The actions that get AWS credentials or install Terraform (and Trivy) are
# pinned to commit SHAs, with the version in a comment so Dependabot can bump
# them. The rest are still on major tags. TODO: pin those too.

jobs:
  terraform:
    name: terraform fmt / validate / lint / plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for the read-only plan role
      pull-requests: write  # post the plan as a PR comment
    defaults:
      run:
        working-directory: terraform
        shell: bash  # -eo pipefail, so a failed plan isn't hidden by tee
    env:
      # Read by root.hcl and _envcommon through get_env, not as TF_VAR_.
      MIGDEMO_OWNER: ${{ vars.OWNER }}
      MIGDEMO_BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      MIGDEMO_ALB_INGRESS_CIDRS: ${{ vars.ALB_INGRESS_CIDRS }}
      MIGDEMO_ENV: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: ./.github/actions/setup-terragrunt

      - name: fmt
        run: |
          terraform fmt -check -recursive -diff
          terragrunt hcl fmt --check --diff

      - name: validate (bootstrap, state-bucket and each layer, no backend)
        run: |
          for d in bootstrap state-bucket layers/network layers/data layers/app layers/observability; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      # Checks every env, including the ones that aren't deployed, against
      # mocked dependency outputs. No AWS access needed.
      - name: terragrunt validate
        working-directory: terraform/environments
        run: |
          terragrunt hcl validate --inputs --strict
          terragrunt list --dag --tree

      # root.hcl and lib.sh pick the same state key. Here, not just in the
      # script tests job, because this job has terragrunt.
      - name: state key check
        run: bash ../scripts/tests/state-kms-key.sh

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids GitHub API rate limits when fetching the AWS ruleset
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      # Fork PRs get no OIDC token, so plan only runs for branches in this repo.
      - name: AWS credentials (read-only plan role)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      # The app layer reads the Aurora cluster and two security groups from
      # AWS by name (see layers/app/main.tf). When testing is torn down they
      # don't exist and the app plan fails. So check first and skip app if
      # they're missing. Observability has no live lookups and plans against
      # the app mocks. Any error other than not found fails the job.
      - name: is testing deployed
        id: stack
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          project=$(sed -n 's/^[[:space:]]*project[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' root.hcl | head -n 1)
          [ -n "$project" ] || { echo "::error::Could not read project from root.hcl"; exit 1; }
          prefix="${project}-${MIGDEMO_ENV}"
          missing=()

          if out=$(aws rds describe-db-clusters --db-cluster-identifier "${prefix}-aurora" \
              --query 'DBClusters[0].Status' --output text 2>&1); then
            echo "Found ${prefix}-aurora ($out)"
          elif grep -q DBClusterNotFoundFault <<<"$out"; then
            missing+=("${prefix}-aurora")
          else
            echo "$out"
            echo "::error::Could not check for ${prefix}-aurora"
            exit 1
          fi

          found=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${prefix}-endpoints,${prefix}-db" \
            --query 'SecurityGroups[].GroupName' --output json)
          for sg in "${prefix}-endpoints" "${prefix}-db"; do
            jq -e --arg n "$sg" 'any(.[]; . == $n)' <<<"$found" > /dev/null || missing+=("$sg")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Missing: ${missing[*]}"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          fi

      # One unit at a time in dependency order, so plan.txt has a header per
      # unit. If an upstream unit has no state yet (or its outputs would
      # change), the units after it are planned against mock outputs. This plan is
      # for review only and is never applied; deploy.yml makes its own.
      - name: plan
        id: plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform/environments/${{ env.MIGDEMO_ENV }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.AWS_REGION }}
          DEPLOYED: ${{ steps.stack.outputs.deployed }}
          MISSING: ${{ steps.stack.outputs.missing }}
        run: |
          # plan-note.txt goes above the plan in the summary and the PR
          # comment, so a long plan can't cut it off.
          : > "$GITHUB_WORKSPACE/plan.txt"
          : > "$GITHUB_WORKSPACE/plan-note.txt"
          if [ "$DEPLOYED" != true ]; then
            {
              echo "${MIGDEMO_ENV} is not deployed (missing: ${MISSING}), so the app plan was skipped."
              echo "Observability was planned against mock app outputs."
            } | tee "$GITHUB_WORKSPACE/plan-note.txt" >> "$GITHUB_WORKSPACE/plan.txt"
            echo >> "$GITHUB_WORKSPACE/plan.txt"
          fi
          for unit in network data app observability; do
            echo "## ${MIGDEMO_ENV}/${unit}" >> "$GITHUB_WORKSPACE/plan.txt"
            if [ "$unit" = app ] && [ "$DEPLOYED" != true ]; then
              echo "Skipped, ${MIGDEMO_ENV} is not deployed." >> "$GITHUB_WORKSPACE/plan.txt"
              echo >> "$GITHUB_WORKSPACE/plan.txt"
              continue
            fi
            terragrunt run --working-dir "$unit" --non-interactive --tf-forward-stdout \
              -- plan -no-color \
              | tee -a "$GITHUB_WORKSPACE/plan.txt"
            echo >> "$GITHUB_WORKSPACE/plan.txt"
          done
          {
            echo "### terragrunt plan (${MIGDEMO_ENV})"
            cat "$GITHUB_WORKSPACE/plan-note.txt"
            echo '```'
            tail -c 60000 "$GITHUB_WORKSPACE/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: comment plan on PR
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const note = fs.readFileSync('plan-note.txt', 'utf8');
            const body = '### terragrunt plan (testing)\n' + note + '```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  scripts:
    name: shellcheck / script tests
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bootstrap-tfvars.sh plans the bootstrap's variables.tf alone, so it
      # needs terraform. No providers, no backend, no AWS.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: install shellcheck
        run: |
          curl -sSfLo /tmp/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/tests/*.sh

      - name: script tests
        run: |
          for t in scripts/tests/*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # Every module with *.tftest.hcl. Plan only, with placeholder keys and
      # overridden data, so no AWS creds. This job has no id-token.
      - name: terraform test
        run: |
          dirs=$(find terraform -name '*.tftest.hcl' -not -path '*/.terraform/*' -not -path '*/.terragrunt-cache/*' |
            sed 's#/tests/[^/]*$##; s#/[^/]*\.tftest\.hcl$##' | sort -u)
          [ -n "$dirs" ] || { echo "no tftest files found"; exit 1; }
          for d in $dirs; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" test
            echo "::endgroup::"
          done

  iac-scan:
    name: checkov (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: checkov
        run: |
          pip install --quiet checkov==3.3.30
          checkov --config-file .checkov.yaml

  secrets-scan:
    name: gitleaks (secret scan of full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

  migrations:
    name: flyway against throwaway Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest pinned. Dependabot doesn't bump images in workflow files, so
        # bump this by hand.
        image: postgres:16.15@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          # Throwaway container on the runner. Trust auth so there's no
          # password in the file at all, not even a fake one.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build migration image
        run: docker build -t demo-migrate:ci db

      # Same order as a deploy to a stack built before the separate logins:
      # V2 as the old owner, then db-logins, then the rest as the Flyway login.
      - name: migrate to V2 (state before this release) as the admin user
        run: |
          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/postgres \
            -e FLYWAY_USER=postgres \
            demo-migrate:ci migrate -target=2

      - name: set up DB logins the way the db-logins task does
        run: |
          # Trust auth ignores passwords, but the script requires them. These
          # are random, never printed, and only live in this job.
          APP_DB_PASSWORD=$(openssl rand -hex 20)
          MIGRATOR_DB_PASSWORD=$(openssl rand -hex 20)
          PGPASSWORD=$(openssl rand -hex 20)
          export APP_DB_PASSWORD MIGRATOR_DB_PASSWORD PGPASSWORD
          # Twice, to prove a re-run is safe.
          for attempt in 1 2; do
            echo "db-logins run $attempt"
            docker run --rm --network host \
              -e PGHOST=localhost -e PGDATABASE=postgres -e PGUSER=postgres \
              -e PGSSLMODE=disable -e PGPASSWORD \
              -e APP_DB_PASSWORD -e MIGRATOR_DB_PASSWORD \
              --entrypoint /flyway/logins/db-logins.sh demo-migrate:ci
          done

      - name: migrate to latest as the Flyway login
        run: |
          run_flyway() {
            docker run --rm --network host \
              -e FLYWAY_URL=jdbc:postgresql://localhost:5432/postgres \
              -e FLYWAY_USER=migrator \
              demo-migrate:ci "$@"
          }
          run_flyway migrate
          run_flyway validate
          run_flyway info

      - name: check the priority rollout result
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE total bigint; nulls bigint; dflt text; nullable text; invalid text;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_name = 'orders' AND column_name = 'priority') THEN
              RAISE NOTICE 'orders.priority not present yet, nothing to check';
              RETURN;
            END IF;
            SELECT count(*), count(*) FILTER (WHERE priority IS NULL)
              INTO total, nulls FROM orders;
            SELECT column_default, is_nullable INTO dflt, nullable
              FROM information_schema.columns
              WHERE table_name = 'orders' AND column_name = 'priority';
            SELECT string_agg(conname, ', ') INTO invalid FROM pg_constraint
              WHERE conrelid = 'orders'::regclass AND NOT convalidated;
            -- V13 backfills every row and sets the default.
            IF total = 0 OR nulls <> 0 THEN
              RAISE EXCEPTION 'expected V13 to backfill every row, % of % still NULL', nulls, total;
            END IF;
            IF dflt IS DISTINCT FROM '''standard''::text' THEN
              RAISE EXCEPTION 'expected priority default standard, got %', dflt;
            END IF;
            -- V14 validates the V12 check, sets NOT NULL and drops its helper check.
            IF nullable <> 'NO' THEN
              RAISE EXCEPTION 'expected orders.priority to be NOT NULL';
            END IF;
            IF invalid IS NOT NULL THEN
              RAISE EXCEPTION 'expected every orders constraint validated, still NOT VALID: %', invalid;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'orders'::regclass
                           AND conname = 'orders_priority_check' AND convalidated) THEN
              RAISE EXCEPTION 'expected orders_priority_check to exist and be validated';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'orders'::regclass
                       AND conname = 'orders_priority_not_null') THEN
              RAISE EXCEPTION 'expected V14 to drop its helper check orders_priority_not_null';
            END IF;
            RAISE NOTICE 'ok: % rows, NOT NULL, default standard, checks validated', total;
          END $$;
          SQL

      - name: check the app login can use rows but not change the schema
        run: |
          app() { psql -X -q -At -h localhost -U app_user -d postgres -v ON_ERROR_STOP=1 -c "$1"; }
          denied() {
            if app "$1" >/dev/null 2>&1; then echo "app_user was allowed: $1"; exit 1; fi
            echo "ok, denied: $1"
          }
          app "SELECT count(*) FROM orders JOIN customers ON customers.id = orders.customer_id"
          app "UPDATE orders SET status = status WHERE false"
          denied "CREATE TABLE should_fail (id int)"
          denied "ALTER TABLE orders ADD COLUMN should_fail int"
          denied "DROP TABLE orders"
          denied "SELECT 1 FROM flyway_schema_history"
          owners=$(psql -X -At -h localhost -U postgres -c "SELECT string_agg(DISTINCT pg_get_userbyid(relowner), ',') FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relkind = 'r'")
          if [ "$owners" != "migrator" ]; then echo "tables owned by: $owners, expected migrator"; exit 1; fi
          echo "ok: every table is owned by migrator"

  app:
    name: app tests and image build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: docker build
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t demo-app:ci .

  sast:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Medium severity and confidence or higher fails. Tests are excluded
      # since they're full of asserts and fake values.
      - name: bandit
        run: |
          pip install --quiet bandit==1.9.4
          bandit -r app --exclude app/tests,app/.venv \
            --severity-level medium --confidence-level medium

  deps-scan:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Any known CVE in the pins or their dependencies fails the job.
      - name: pip-audit
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit --progress-spinner off \
            -r app/requirements.txt -r app/requirements-dev.txt

  image-scan:
    name: trivy (container image scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built on the runner, never pushed.
      - name: build images
        run: |
          docker build -t demo-app:ci app
          docker build -t demo-migrate:ci db

      # Pinned to a SHA, not a tag. Trivy's tags were hijacked in March 2026
      # (GHSA-69fq-xp46-6x23) and a SHA can't be moved. ignore-unfixed skips
      # CVEs with nothing to upgrade to yet.
      - name: scan app image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-app.sarif

      - name: scan migration image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-migrate.sarif

      # Fork PRs get a read-only token, so only same-repo PRs upload.
      - name: upload app results to Security tab
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app-image

      - name: upload migration results to Security tab
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-migrate.sarif
          category: trivy-migrate-image

      # The actual gate: a fixable HIGH or CRITICAL in either image fails.
      - name: gate on app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: gate on migration image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-migrate:ci
          version: v0.70.0
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
